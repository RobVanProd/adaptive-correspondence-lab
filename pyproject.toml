[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adaptive-correspondence-lab"
version = "0.1.0"
description = "CPU-first experiments on predictive correspondences between adaptive dynamical systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adaptive Correspondence Lab contributors" }]
keywords = ["replicator-dynamics", "multiplicative-weights", "natural-gradient", "information-geometry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9"]
plot = ["matplotlib>=3.8"]
symbolic = ["sympy>=1.12", "mpmath>=1.3"]

[project.scripts]
acl = "adaptive_correspondence.cli:main"

[project.urls]
Repository = "https://github.com/RobVanProd/adaptive-correspondence-lab"
Issues = "https://github.com/RobVanProd/adaptive-correspondence-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_correspondence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
